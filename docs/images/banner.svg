<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">bcuz</title>
  <desc id="desc">bcuz "run the tests" make test: run a command with a reason, and keep a record.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect x="60" y="62" width="8" height="92" rx="4" fill="url(#accent)"/>
  <text x="92" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#f8fafc">bcuz</text>
  <text x="96" y="186" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#cbd5e1">run a command with a reason</text>
  <rect x="60" y="226" width="1160" height="58" rx="12" fill="#020617" fill-opacity="0.65"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="28">
    <text x="88" y="264" fill="#64748b">$</text>
    <text x="124" y="264" fill="#38bdf8">bcuz</text>
    <text x="214" y="264" fill="#fbbf24">"run the tests"</text>
    <text x="460" y="264" fill="#e2e8f0">make test</text>
  </g>
</svg>
